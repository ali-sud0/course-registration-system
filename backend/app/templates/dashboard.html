    <main class="main-content">
      <section class="navbar">
        <span id="navbarTitle">سلام </span>
        <label>خوش آمدید!</label>
      </section>

      <div class="main-body">
        <header class="main-header">
          <div class="text-container">
            <h2>دروس</h2>
            <p class="small-muted">همه جزئیات مربوط به درس‌ها را از اینجا مدیریت کنید</p>
          </div>

          <button class="btn primary" id="openAddCourseModal">+ افزودن درس</button>
        </header>

        <div class="table">
          <section class="controls">

            <div class="filter-row">
              <input id="filterName" type="text" placeholder="نام درس">
              <input id="filterProfessor" type="text" placeholder="نام استاد">
              <button id="btnFilter" class="btn primary">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M13.9999 13.9999L11.1066 11.1066M12.6667 7.33333C12.6667 10.2789 10.2789 12.6667 7.33333 12.6667C4.38781 12.6667 2 10.2789 2 7.33333C2 4.38781 4.38781 2 7.33333 2C10.2789 2 12.6667 4.38781 12.6667 7.33333Z"
                    stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                جستجو
              </button>
            </div>
          </section>

          <section class="table-section">
            <table>
              <thead>
                <tr class="table-head">
                  <td>نام درس</td>
                  <td>کد درس</td>
                  <td>واحد</td>
                  <td>گروه</td>
                  <td>ظرفیت</td>
                  <td>استاد</td>
                  <td>زمان کلاس</td>
                  <td>تاریخ امتحان</td>
                  <td>عملیات</td>
                </tr>
              </thead>

              <tbody id="coursesContainer">



              </tbody>


            </table>
            <div id="emptyStateCourse" class="empty-state-courses">

              <img src="../static/images/no-content.png">
              <h4 class="empty-state-title">درسی یافت نشد</h4>
              <p>برای افزودن درس روی دکمه “افزودن درس” کلیک کنید</p>

            </div>
          </section>
        </div>
      </div>


    </main>
  </div>

    <div class="toast-line"></div>
    <div class="toast-text">
      <Label id="toastTitle">خطا !</Label>
      <span id="toastDesc">تداخل در برنامه هفتگی وجود دارد</span>
    </div>
  </div>

  <div id="courseOptions" class="course-menu-wrapper">
    <div id="courseEdit" class="course-menu-item">

      <span>ویرایش</span>
    </div>
    <div id="courseDelete" class="course-menu-item red">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M9.5 3V10C9.5 10.2652 9.39464 10.5196 9.20711 10.7071C9.01957 10.8946 8.76522 11 8.5 11H3.5C3.23478 11 2.98043 10.8946 2.79289 10.7071C2.60536 10.5196 2.5 10.2652 2.5 10V3M1.5 3H10.5M4 3V2C4 1.73478 4.10536 1.48043 4.29289 1.29289C4.48043 1.10536 4.73478 1 5 1H7C7.26522 1 7.51957 1.10536 7.70711 1.29289C7.89464 1.48043 8 1.73478 8 2V3"

    </div>
  </div>

  <!-- مودال افزودن درس -->
  <div id="addCourseModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h3 id="modalTitle">افزودن درس جدید</h3>
      <form id="addCourseForm" class="course-form">
        <div class="input-container">
          <label>نام درس</label>
          <input id="c-name" type="text" placeholder="نام درس" required>
        </div>

        <div class="input-container">
          <label>کد درس</label>
          <input id="c-code" type="number" placeholder="کد درس" required>
        </div>

        <div class="input-container">
          <label>تعداد واحد</label>
          <input id="c-units" type="number" placeholder="تعداد واحد" required>
        </div>

        <div class="input-container">
          <label>استاد</label>
          <select id="c-professor">
            <option value="">--- انتخاب استاد ---</option>
            <option value="ادیب‌فر">مهندس ادیب‌فر</option>
            <option value="دکتر حسینی">دکتر حسینی</option>
          </select>
        </div>


        <div class="input-container">
          <label>گروه</label>
          <input id="c-group" type="number" placeholder="گروه" required>
        </div>

        <div class="input-container">
          <label>ظرفیت</label>
          <input id="c-cap" type="number" placeholder="ظرفیت" required>
        </div>


        <div class="input-container">
          <label>زمان کلاس</label>
          <input id="c-time" type="date">
        </div>


        <div class="input-container">
          <label>تاریخ امتحان</label>
          <input id="c-exam" type="date">
        </div>



        <div class="form-actions">
          <button type="button" class="btn secondary" id="cancelModal">انصراف</button>
          <button type="submit" class="btn primary">ذخیره</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../static/js/dashboard.js" defer></script>
</body>
