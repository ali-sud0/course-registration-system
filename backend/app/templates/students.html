<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>درسینو - دانشجویان</title>
  <link rel="stylesheet" href="../static/css/base.css">
  <link rel="stylesheet" href="../static/css/components.css">
  <link rel="stylesheet" href="../static/css/courses.css">
  <style>
    .student-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .student-card:hover {
      border-color: #4338ca;
      box-shadow: 0 1px 3px rgba(67, 56, 202, 0.1);
    }

    .student-info {
      flex: 1;
    }

    .student-name {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .student-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 12px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
    }

    .detail-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 14px;
      color: #374151;
      font-weight: 500;
    }

    .student-list {
      max-height: 600px;
      overflow-y: auto;
    }

    .student-list::-webkit-scrollbar {
      width: 8px;
    }

    .student-list::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }

    .student-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .student-list::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .empty-state p {
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .student-details {
        grid-template-columns: 1fr;
      }

      .student-card {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
