			<button id="logoutBtn" class="btn btn-logout">
				<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M13.3333 14.1667L17.5 10M17.5 10L13.3333 5.83333M17.5 10H7.5M7.5 17.5H4.16667C3.72464 17.5 3.30072 17.3244 2.98816 17.0118C2.67559 16.6993 2.5 16.2754 2.5 15.8333V4.16667C2.5 3.72464 2.67559 3.30072 2.98816 2.98816C3.30072 2.67559 3.72464 2.5 4.16667 2.5H7.5" stroke="#EF4444" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />

				<span>خروج از حساب</span>
			</button>
		</aside>

		<main class="main-content">
			<section class="navbar">
				<span id="navbarTitle">مدیریت</span>
				<label>خوش آمدید!</label>
			</section>

			<div class="main-body">
				<div class="text-header">
					<div class="text-container">
						<h2>تنظیمات سیستم (ادمین)</h2>
						<p class="small-muted">پیکربندی و مدیریت تنظیمات اصلی سامانه از این قسمت انجام می‌شود</p>
					</div>

				</div>

				<div class="settings-container">
					<div class="text-header">
						<div class="text-container">
							<h2 class="text-container-title">محدودیت تعداد واحد</h2>
							<p class="small-muted">از قسمت زیر می‌توانید حداقل و حداکثر واحد‌های اخذ شده توسط یک دانشجو را مشخص کنید</p>
						</div>
					</div>

					<div class="units-container">
						<div class="input-container">
							<label>حداقل واحد</label>
							<input id="minUnits" type="number" placeholder="حداقل واحد" required>
						</div>

						<div class="input-container">
							<label>حداکثر واحد</label>
							<input id="maxUnits" type="number" placeholder="حداکثر واحد" required>
						</div>

					</div>
					<div class="button-container">
					<button id="btnSave" type="button" class="btn primary">ذخیره</button>
					</div>


				</div>


		</main>
	</div>


	<div id="toast" class="toast">
		<div class="toast-line"></div>
		<div class="toast-text">
			<Label id="toastTitle">اطلاع</Label>
			<span id="toastDesc"></span>
		</div>
	</div>

	<script src="../static/js/settings.js" defer></script>
</body>

</html>
