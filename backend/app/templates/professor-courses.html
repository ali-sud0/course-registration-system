<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>درسینو - دروس</title>
  <link rel="stylesheet" href="../static/css/base.css">
  <link rel="stylesheet" href="../static/css/components.css">
  <link rel="stylesheet" href="../static/css/courses.css">
  <style>
    .courses-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .course-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      cursor: pointer;
    }

    .course-card:hover {
      border-color: #4338ca;
      box-shadow: 0 1px 3px rgba(67, 56, 202, 0.1);
    }

    .course-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .course-name {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
    }

    .course-code {
      color: #6b7280;
      font-size: 13px;
    }

    .course-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-label {
      font-size: 12px;
      color: #6b7280;
    }

    .info-value {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }

    .students-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    .students-header {
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .student-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .student-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: #f9fafb;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .student-name {
      font-size: 14px;
      color: #1f2937;
      flex: 1;
    }

    .remove-btn {
      background: #EF4444;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background: #DC2626;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../static/images/logo.png" alt="لوگو" class="logo">
        <div class="brand-title">درسینو</div>
      </div>
      <nav class="menu">
        <a id="menuProfCourses" href="/professors/courses">
          <div class="menu-item active">
            <p class="menu-item-text active">دروس</p>
          </div>
        </a>
      </nav>
      <div style="flex:1"></div>
      <button id="logoutBtn" class="btn btn-logout">خروج از حساب</button>
    </aside>

    <main class="main-content">
      <section class="navbar">
        <span id="navbarTitle">سلام استاد</span>
        <label>دروس ارائه‌شده</label>
      </section>

      <div class="main-body">
        <div class="text-header">
          <div class="text-container">
            <h2>دروس ارائه‌شده</h2>
            <p class="small-muted">فهرست دروسی که شما ارائه داده‌اید. برای مشاهده دانشجویان، روی "جزئیات" کلیک کنید.</p>
          </div>
        </div>

        <div id="professorAlert" style="display:none; padding:12px; background:#fff6e5; border:1px solid #fadb6a; margin-bottom:12px; border-radius:6px; color:#333;"></div>

        <div class="courses-list" id="coursesList">
          <!-- Offered courses will be rendered here by professor-courses.js -->
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" style="display:none;"></div>

  <!-- Students modal -->
  <div id="studentsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;">
    <div style="background:white; width:92%; max-width:720px; border-radius:8px; padding:16px; max-height:80vh; overflow:auto; position:relative; direction:rtl;">
      <button id="closeStudentsModal" style="position:absolute; left:12px; top:12px; background:#eee;border:0;padding:6px 8px;border-radius:4px;cursor:pointer;">بستن</button>
      <h3 id="studentsModalTitle">لیست دانشجویان</h3>
      <div id="studentsModalList" style="margin-top:12px;"></div>
    </div>
  </div>

  <script src="../static/js/professor-courses.js" defer></script>
</body>

</html>
