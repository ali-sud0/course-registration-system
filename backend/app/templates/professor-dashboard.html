<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>درسینو - داشبورد استاد</title>
  <link rel="stylesheet" href="../static/css/base.css">
  <link rel="stylesheet" href="../static/css/components.css">
  <link rel="stylesheet" href="../static/css/courses.css">
  <style>
    body { direction: rtl; font-family: sans-serif; }
    .center-wrap { height: 100vh; display: flex; align-items: center; justify-content: center; }
    .big-red-btn { background: #ef4444; color: white; border: none; padding: 18px 28px; border-radius: 8px; font-size: 18px; cursor: pointer; }
  </style>
</head>

<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../static/images/logo.png" alt="لوگو" class="logo">
        <div class="brand-title">درسینو</div>
      </div>
      <nav class="menu">
        <a id="menuDashboard" href="/professors/dashboard">
          <div class="menu-item active">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9.99996 5.83333V17.5M9.99996 5.83333C9.99996 4.94928 9.64877 4.10143 9.02365 3.47631C8.39853 2.85119 7.55068 2.5 6.66663 2.5H2.49996C2.27895 2.5 2.06698 2.5878 1.9107 2.74408C1.75442 2.90036 1.66663 3.11232 1.66663 3.33333V14.1667C1.66663 14.3877 1.75442 14.5996 1.9107 14.7559C2.06698 14.9122 2.27895 15 2.49996 15H7.49996C8.163 15 8.79889 15.2634 9.26773 15.7322C9.73657 16.2011 9.99996 16.837 9.99996 17.5M9.99996 5.83333C9.99996 4.94928 10.3511 4.10143 10.9763 3.47631C11.6014 2.85119 12.4492 2.5 13.3333 2.5H17.5C17.721 2.5 17.9329 2.5878 18.0892 2.74408C18.2455 2.90036 18.3333 3.11232 18.3333 3.33333V14.1667C18.3333 14.3877 18.2455 14.5996 18.0892 14.7559C17.9329 14.9122 17.721 15 17.5 15H12.5C11.8369 15 11.201 15.2634 10.7322 15.7322C10.2634 16.2011 9.99996 16.837 9.99996 17.5M13.3333 10H15M13.3333 6.66667H15M4.99996 10H6.66663M4.99996 6.66667H6.66663" stroke="#4338CA" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <p class="menu-item-text active">داشبورد</p>
          </div>
        </a>
      </nav>
      <div style="flex:1"></div>
      <button id="logoutBtn" class="btn btn-logout">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13.3333 14.1667L17.5 10M17.5 10L13.3333 5.83333M17.5 10H7.5M7.5 17.5H4.16667C3.72464 17.5 3.30072 17.3244 2.98816 17.0118C2.67559 16.6993 2.5 16.2754 2.5 15.8333V4.16667C2.5 3.72464 2.67559 3.30072 2.98816 2.98816C3.30072 2.67559 3.72464 2.5 4.16667 2.5H7.5" stroke="#EF4444" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>خروج از حساب</span>
      </button>
    </aside>

    <main class="main-content">
      <section class="navbar">
        <span id="navbarTitle">سلام استاد</span>
        <label>داشبورد</label>
      </section>

      <div class="main-body">
        <div class="text-header">
          <div class="text-container">
            <h2>داشبورد</h2>
            <p class="small-muted">فهرست دروسی که شما ارائه داده‌اید. برای مشاهده دانشجویان، روی "جزئیات" کلیک کنید.</p>
          </div>
        </div>

        <div class="table">
          <section class="table-section">
            <table>
              <thead>
                <tr class="table-head">
                  <td>نام درس</td>
                  <td>کد درس</td>
                  <td>واحد</td>
                  <td>گروه</td>
                  <td>ظرفیت</td>
                  <td>کلاس</td>
                  <td>عملیات</td>
                </tr>
              </thead>
              <tbody id="coursesContainer">
              </tbody>
            </table>
            <div id="emptyStateCourse" class="empty-state-courses">
              <img src="../static/images/no-content.png">
              <h4 class="empty-state-title">درسی یافت نشد</h4>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" style="display:none;"></div>

  <!-- Students modal -->
  <div id="studentsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;">
    <div style="background:white; width:92%; max-width:800px; border-radius:10px; padding:24px; max-height:80vh; overflow:auto; position:relative; box-shadow: 0 10px 40px rgba(0,0,0,0.15);">
      <button id="closeStudentsModal" style="position:absolute; left:12px; top:12px; background:#eee;border:0;padding:6px 8px;border-radius:4px;cursor:pointer;font-weight:bold;">×</button>
      <h3 id="studentsModalTitle" style="margin:0 0 24px 0; color:#111827; font-size:20px; font-weight:600;">لیست دانشجویان</h3>
      <div style="overflow-x: auto;">
        <table style="width:100%; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 2px solid #e5e7eb; background: #f9fafb;">
              <th style="padding: 12px; text-align: right; font-size: 13px; font-weight: 600; color: #374151;">نام و نام خانوادگی</th>
              <th style="padding: 12px; text-align: right; font-size: 13px; font-weight: 600; color: #374151; width: 140px;">شماره دانشجو</th>
              <th style="padding: 12px; text-align: center; font-size: 13px; font-weight: 600; color: #374151; width: 80px;">عملیات</th>
            </tr>
          </thead>
          <tbody id="studentsModalList">
          </tbody>
        </table>
      </div>
      <div id="emptyStateStudents" style="display:none; text-align:center; padding:40px 20px; color:#6b7280;">
        <img src="../static/images/no-content.png" alt="خالی" style="width:80px; margin-bottom:12px;">
        <h4 style="margin:0; color:#374151;">دانشجویی یافت نشد</h4>
      </div>
    </div>
  </div>

  <script src="../static/js/professor-dashboard.js" defer></script>
</body>

</html>
