<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>درسینو - ورود</title>
  <link rel="stylesheet" href="../static/css/base.css">
  <link rel="stylesheet" href="../static/css/components.css">
  <link rel="stylesheet" href="../static/css/login.css">
</head>

<body>
  <div class="center-wrapper">
    <div class="card login-card">
      <div class="card-header">
        <div class="logo-container">
          <div class="version small-version">نسخه ۱.۰</div>
          <img src="../static/images/logo.png" alt="لوگو" class="logo small">
          <div class="titles">
            <div class="brand-title">درسینو</div>
            <div class="subtitle">سیستم جامع انتخاب واحد</div>
          </div>
        </div>

      </div>
      <hr class="divider">
      <label class="field-label" for="username">نام کاربری</label>
      <div class="input-box">
        <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M8.00002 8.66667C9.84097 8.66667 11.3334 7.17428 11.3334 5.33333C11.3334 3.49238 9.84097 2 8.00002 2C6.15907 2 4.66669 3.49238 4.66669 5.33333C4.66669 7.17428 6.15907 8.66667 8.00002 8.66667ZM8.00002 8.66667C9.41451 8.66667 10.7711 9.22857 11.7713 10.2288C12.7715 11.229 13.3334 12.5855 13.3334 14M8.00002 8.66667C6.58553 8.66667 5.22898 9.22857 4.22878 10.2288C3.22859 11.229 2.66669 12.5855 2.66669 14"
            stroke="#94A3B8" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

        <input id="username" type="text" placeholder="نام کاربری" autocomplete="username">
      </div>
      <label class="field-label" for="password">رمز عبور</label>
      <div class="input-box">
        <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M4.66667 6.66658V4.66659C4.66667 3.78253 5.01786 2.93468 5.64298 2.30956C6.2681 1.68444 7.11595 1.33325 8 1.33325C8.88406 1.33325 9.7319 1.68444 10.357 2.30956C10.9821 2.93468 11.3333 3.78253 11.3333 4.66659V6.66658M8.66667 10.6666C8.66667 11.0348 8.36819 11.3333 8 11.3333C7.63181 11.3333 7.33333 11.0348 7.33333 10.6666C7.33333 10.2984 7.63181 9.99992 8 9.99992C8.36819 9.99992 8.66667 10.2984 8.66667 10.6666ZM3.33333 6.66658H12.6667C13.403 6.66658 14 7.26354 14 7.99992V13.3333C14 14.0696 13.403 14.6666 12.6667 14.6666H3.33333C2.59695 14.6666 2 14.0696 2 13.3333V7.99992C2 7.26354 2.59695 6.66658 3.33333 6.66658Z"
            stroke="#94A3B8" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

        <input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password">
        <button type="button" id="togglePassword" class="eye-btn" aria-label="نمایش رمز">
          <svg class="eye-icon" id="eyeHidden" width="16" height="16" viewBox="0 0 16 16" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M1.37468 8.232C1.31912 8.08232 1.31912 7.91767 1.37468 7.768C1.91581 6.4559 2.83435 5.33402 4.01386 4.5446C5.19336 3.75517 6.58071 3.33374 8.00001 3.33374C9.41932 3.33374 10.8067 3.75517 11.9862 4.5446C13.1657 5.33402 14.0842 6.4559 14.6253 7.768C14.6809 7.91767 14.6809 8.08232 14.6253 8.232C14.0842 9.54409 13.1657 10.666 11.9862 11.4554C10.8067 12.2448 9.41932 12.6663 8.00001 12.6663C6.58071 12.6663 5.19336 12.2448 4.01386 11.4554C2.83435 10.666 1.91581 9.54409 1.37468 8.232Z"
              stroke="#0F172A" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
            <path
              d="M8 9.99992C9.10457 9.99992 10 9.10449 10 7.99992C10 6.89535 9.10457 5.99992 8 5.99992C6.89543 5.99992 6 6.89535 6 7.99992C6 9.10449 6.89543 9.99992 8 9.99992Z"
              stroke="#0F172A" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          <svg class="eye-icon" id="eyeVisible" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M10.0002 12L9.51884 9.83337M1.3335 5.33337C1.8324 6.70056 2.73958 7.8813 3.9321 8.71557C5.12461 9.54984 6.54479 9.9973 8.00016 9.9973C9.45553 9.9973 10.8757 9.54984 12.0682 8.71557C13.2607 7.8813 14.1679 6.70056 14.6668 5.33337M13.3335 10L12.1828 8.63334M2.66683 10L3.8175 8.63334M6.00016 12L6.4815 9.83337"
              stroke="#0F172A" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
          </svg>


        </button>
      </div>
      <button id="loginBtn" class="btn primary full">ورود</button>
      <p id="errorText" class="error-message">نام کاربری یا رمز عبور اشتباه است</p>
    </div>
  </div>
  <script src="../static/js/login.js" defer></script>
</body>

</html>
