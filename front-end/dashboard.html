<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>درسینو - داشبورد</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <img src="images/logo.png" alt="لوگو" class="logo">
      <div class="brand-title">درسینو</div>
      <nav class="menu">
        <a href="#" class="menu-item active">دروس</a>
        <a href="#" class="menu-item">اساتید</a>
        <a href="#" class="menu-item">دانشجویان</a>
        <a href="#" class="menu-item">تنظیمات</a>
      </nav>
      <button id="logoutBtn" class="btn danger small">خروج</button>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <h2>دروس</h2>
        <p class="small-muted">همه جزئیات مربوط به درس‌ها را از اینجا مدیریت کنید</p>
      </header>

      <section class="controls">
        <button class="btn primary" id="openAddCourseModal">+ افزودن درس</button>
        <div class="filter-row">
          <input id="filterName" type="text" placeholder="نام درس">
          <input id="filterCode" type="text" placeholder="کد درس">
          <button id="btnFilter" class="btn">جستجو</button>
        </div>
      </section>

      <section class="table-section">
        <div class="table-head">
          <div>نام درس</div>
          <div>کد</div>
          <div>استاد</div>
          <div>گروه</div>
          <div>ظرفیت</div>
          <div>زمان کلاس</div>
          <div>تاریخ امتحان</div>
          <div>عملیات</div>
        </div>
        <div id="coursesContainer" class="table-body"></div>
      </section>
    </main>
  </div>

  <!-- مودال افزودن درس -->
  <div id="addCourseModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h3>افزودن درس جدید</h3>
      <form id="addCourseForm" class="course-form">
        <label>نام درس</label>
        <input id="c-name" type="text" placeholder="نام درس" required>

        <label>کد درس</label>
        <input id="c-code" type="text" placeholder="کد درس" required>

        <label>استاد</label>
        <select id="c-teacher">
          <option value="">انتخاب استاد</option>
          <option value="ادیب‌فر">مهندس ادیب‌فر</option>
          <option value="دکتر حسینی">دکتر حسینی</option>
        </select>

        <label>گروه</label>
        <input id="c-group" type="text" placeholder="گروه" required>

        <label>ظرفیت</label>
        <input id="c-cap" type="number" placeholder="ظرفیت" required>

        <label>زمان کلاس</label>
        <input id="c-time" type="date">

        <label>تاریخ امتحان</label>
        <input id="c-exam" type="date">

        <div class="form-actions">
          <button type="submit" class="btn primary">ذخیره</button>
          <button type="button" class="btn secondary" id="cancelModal">انصراف</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/dashboard.js" defer></script>
</body>
</html>
