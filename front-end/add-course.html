<!-- add-course.html - فرم افزودن درس (مستقل) -->
<!DOCTYPE html> <!-- نوع سند -->
<html lang="fa"> <!-- زبان -->
<head> <!-- شروع head -->
  <meta charset="utf-8"> <!-- UTF-8 -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- ریسپانسیو -->
  <title>افزودن درس - درسینو</title> <!-- عنوان -->
  <link rel="stylesheet" href="css/style.css"> <!-- استایل مشترک -->
</head> <!-- پایان head -->
<body> <!-- شروع body -->
  <div class="center-wrapper"> <!-- wrapper مرکزی -->
    <div class="card add-card"> <!-- کارت فرم -->
      <div class="card-header"> <!-- سربرگ کارت -->
        <img src="images/logo.png" alt="لوگو" class="logo small"> <!-- لوگو -->
        <div class="titles">
          <div class="brand-title">افزودن درس جدید</div> <!-- عنوان فرم -->
          <div class="subtitle">مشخصات درس را وارد کنید و ذخیره نمایید</div> <!-- توضیح -->
        </div> <!-- پایان titles -->
      </div> <!-- پایان card-header -->

      <form id="addCourseForm" class="course-form"> <!-- فرم با آیدی -->
        <label>نام درس</label>
        <input id="c-name" type="text" placeholder="نام درس" required>

        <label>کد درس</label>
        <input id="c-code" type="text" placeholder="کد درس" required>

        <label>استاد</label>
        <select id="c-teacher">
          <option value="">انتخاب استاد</option>
          <option value="ادیب‌فر">مهندس ادیب‌فر</option>
          <option value="دکتر حسینی">دکتر حسینی</option>
        </select>

        <label>گروه</label>
        <input id="c-group" type="text" placeholder="گروه" required>

        <label>ظرفیت</label>
        <input id="c-cap" type="number" placeholder="ظرفیت" required>

        <label>زمان کلاس</label>
        <input id="c-time" type="text" placeholder="مثال: یکشنبه ۱۴-۱۶">

        <label>تاریخ امتحان</label>
        <input id="c-exam" type="text" placeholder="مثال: ۱۴۰۴/۱۱/۲۱ - ۱۰:۳۰">

        <div class="form-actions">
          <button type="submit" class="btn primary">ذخیره</button> <!-- ذخیره -->
          <a href="dashboard.html" class="btn secondary">انصراف</a> <!-- بازگشت -->
        </div> <!-- پایان form-actions -->
      </form> <!-- پایان فرم -->
    </div> <!-- پایان کارت -->
  </div> <!-- پایان wrapper -->

  <script src="js/add-course.js" defer></script> <!-- اسکریپت فرم افزودن -->
</body> <!-- پایان body -->
</html> <!-- پایان سند -->
