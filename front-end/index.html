<!-- index.html - صفحه آغازین با دو دکمه ورود و ثبت‌نام -->
<!DOCTYPE html> <!-- اعلام نوع سند HTML5 -->
<html lang="fa"> <!-- تعیین زبان صفحه به فارسی -->
<head> <!-- شروع بخش head -->
  <meta charset="utf-8"> <!-- تعیین یونیکد UTF-8 -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- ریسپانسیو -->
  <title>درسینو - صفحه آغازین</title> <!-- عنوان تب -->
  <link rel="stylesheet" href="css/style.css"> <!-- پیوند به فایل استایل مشترک -->
</head> <!-- پایان بخش head -->
<body> <!-- شروع بدنه صفحه -->
  <div class="center-wrapper"> <!-- کانتینر مرکزی برای مرکزچین کردن محتوا -->
    <div class="card start-card"> <!-- کارت سفید صفحه آغازین -->
      <img src="images/logo.png" alt="لوگو درسینو" class="logo"> <!-- محل لوگو (بعدا جایگزین کن) -->
      <h1 class="brand-title">درسینو</h1> <!-- نام اپ -->
      <p class="version">نسخه ۱.۰</p> <!-- نمایش نسخه -->
      <div class="btn-row"> <!-- ردیف دکمه‌ها -->
        <a href="login.html" class="btn primary">ورود</a> <!-- لینک به صفحه لاگین -->
        <a href="#" class="btn secondary">ثبت‌نام</a> <!-- دکمه ثبت‌نام (الان نمایشی) -->
      </div> <!-- پایان ردیف دکمه‌ها -->
    </div> <!-- پایان کارت -->
  </div> <!-- پایان wrapper -->
<script src="js/login.js" defer></script> <!-- اسکریپت صفحه (در صورت نیاز به JS در index) -->
</body> <!-- پایان بدنه -->
</html> <!-- پایان سند -->
